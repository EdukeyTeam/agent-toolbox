<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Agent usage report</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef1f4; --border: #dce1e7; --text: #18212d;
  --muted: #566173; --faint: #8b94a3; --accent: #0f766e;
  --c1: #0f766e; --c2: #5fb3a9; --c3: #6d4fc2; --c4: #a993e0; --c5: #d4604b; --c6: #eea493; --c7: #7c8796; --c8: #b9dcd6;
  --track: #e6eaef; --free: #d7e9e6; --hatch: #8b94a3;
  --info-bg: #eef6f5; --info-border: #b8dbd6; --warn-bg: #fdf1ec; --warn-border: #efb9aa; --warn-text: #8c3420;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 2px 6px rgba(16, 24, 40, .05);
  --focus: #6d4fc2; --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #151c25; --surface-2: #1c2530; --border: #2a3441; --text: #e5e9ef;
    --muted: #a2acba; --faint: #76808f; --accent: #3cbfae;
    --c1: #33b5a5; --c2: #1f7c72; --c3: #a28be6; --c4: #6650b0; --c5: #f08a73; --c6: #a5513f; --c7: #8b95a5; --c8: #24524c;
    --track: #232d39; --free: #1d3a37; --hatch: #76808f;
    --info-bg: #142a29; --info-border: #24524c; --warn-bg: #33201b; --warn-border: #7a3a2b; --warn-text: #f6b5a5;
    --shadow: none; --focus: #a993e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c25; --surface-2: #1c2530; --border: #2a3441; --text: #e5e9ef;
  --muted: #a2acba; --faint: #76808f; --accent: #3cbfae;
  --c1: #33b5a5; --c2: #1f7c72; --c3: #a28be6; --c4: #6650b0; --c5: #f08a73; --c6: #a5513f; --c7: #8b95a5; --c8: #24524c;
  --track: #232d39; --free: #1d3a37; --hatch: #76808f;
  --info-bg: #142a29; --info-border: #24524c; --warn-bg: #33201b; --warn-border: #7a3a2b; --warn-text: #f6b5a5;
  --shadow: none; --focus: #a993e6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
.skip-link { position: absolute; left: -9999px; top: 8px; background: var(--surface); color: var(--text); padding: 8px 12px; border-radius: 8px; z-index: 10; }
.skip-link:focus { left: 8px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { line-height: 1.25; margin: 0; }
h1 { font-size: 1.65rem; font-weight: 680; letter-spacing: -.01em; }
h2 { font-size: 1.2rem; font-weight: 650; }
h3 { font-size: 1rem; font-weight: 640; }
p { margin: 0; }
.masthead { background: var(--surface); border-bottom: 1px solid var(--border); }
.masthead-inner { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; padding-top: 22px; padding-bottom: 14px; flex-wrap: wrap; }
.eyebrow { color: var(--accent); font-size: .78rem; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.scope { color: var(--muted); margin-top: 6px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.badge { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.badge.warn { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
.actions { display: flex; gap: 8px; }
.btn { font: inherit; font-size: .85rem; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn-quiet { border-color: transparent; color: var(--accent); padding-left: 0; background: transparent; }
.btn-quiet:hover { background: transparent; text-decoration: underline; }
.toc { display: flex; gap: 4px 14px; flex-wrap: wrap; padding-bottom: 12px; font-size: .85rem; }
.toc a { color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--accent); text-decoration: underline; }
main { padding-top: 18px; padding-bottom: 48px; }
main:focus { outline: none; }
.section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 18px; scroll-margin-top: 150px; }
.section-head { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.section-head .lead { color: var(--muted); font-size: .9rem; flex-basis: 100%; }
.section-body > * + * { margin-top: 14px; }
.filters { position: sticky; top: 0; z-index: 5; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 16px; margin-bottom: 18px; }
.filter-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: .8rem; color: var(--muted); }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
.field select, .field input { font: inherit; font-size: .88rem; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; min-width: 9rem; max-width: 100%; }
.filter-status { font-size: .82rem; color: var(--muted); margin-top: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
#summary .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (min-width: 641px) and (max-width: 900px) { #summary .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.stat { border-top: 3px solid var(--border); }
.stat.accent-teal { border-top-color: var(--c1); }
.stat.accent-coral { border-top-color: var(--c5); }
.stat.accent-purple { border-top-color: var(--c3); }
.stat-label { font-size: .8rem; color: var(--muted); font-weight: 600; }
.stat-value { font-size: 1.45rem; font-weight: 680; margin-top: 2px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.stat-sub { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.delta { font-size: .8rem; font-weight: 600; margin-top: 6px; color: var(--text); }
.note { font-size: .85rem; color: var(--muted); }
.meta { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
.notice { border: 1px solid var(--info-border); background: var(--info-bg); border-radius: 10px; padding: 10px 14px; font-size: .88rem; }
.notice strong { display: block; margin-bottom: 2px; }
.notice.warn { border-color: var(--warn-border); background: var(--warn-bg); color: var(--warn-text); }
.empty { border: 1px dashed var(--border); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--text); margin-bottom: 4px; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.segmented button { font: inherit; font-size: .82rem; border: 0; background: var(--surface); color: var(--muted); padding: 5px 12px; cursor: pointer; }
.segmented button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.chart-title { font-size: .9rem; font-weight: 620; }
.chart-wrap { overflow-x: auto; }
svg.chart { display: block; width: 100%; min-width: 520px; height: auto; }
.chart .grid { stroke: var(--border); stroke-width: 1; }
.chart .axis { stroke: var(--faint); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 11px; font-family: inherit; }
.chart .bar:hover rect { opacity: .82; }
.c1 { fill: var(--c1); background: var(--c1); } .c2 { fill: var(--c2); background: var(--c2); }
.c3 { fill: var(--c3); background: var(--c3); } .c4 { fill: var(--c4); background: var(--c4); }
.c5 { fill: var(--c5); background: var(--c5); } .c6 { fill: var(--c6); background: var(--c6); }
.c7 { fill: var(--c7); background: var(--c7); } .c8 { fill: var(--c8); background: var(--c8); }
.track { fill: var(--track); }
.free { fill: var(--free); background: var(--free); }
.residual { background: repeating-linear-gradient(45deg, var(--track), var(--track) 3px, var(--hatch) 3px, var(--hatch) 5px); }
.hatch-bg { fill: var(--track); }
.hatch-line { stroke: var(--hatch); stroke-width: 3; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 0; margin: 8px 0 0; font-size: .82rem; color: var(--muted); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; }
.gauge { display: flex; flex-direction: column; gap: 6px; }
.gauge-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .85rem; }
.gauge-title { font-weight: 620; }
.gauge-value { color: var(--muted); }
svg.stack { display: block; width: 100%; height: 28px; border-radius: 6px; overflow: visible; }
svg.stack .marker { stroke: var(--text); stroke-width: 2; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.two-col > * { min-width: 0; }
@media (min-width: 900px) { .two-col { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.barlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.barlist li { display: grid; grid-template-columns: minmax(7rem, 13rem) 1fr minmax(4.5rem, auto); gap: 4px 10px; align-items: center; font-size: .85rem; }
.bl-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bl-value { text-align: right; font-weight: 600; }
.bl-note { grid-column: 2 / -1; font-size: .76rem; color: var(--muted); margin-top: -4px; }
svg.bar-svg { display: block; width: 100%; height: 10px; border-radius: 4px; }
.quota-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.quota-title { font-weight: 640; overflow-wrap: anywhere; }
.quota-sub { font-size: .8rem; color: var(--muted); margin-bottom: 10px; overflow-wrap: anywhere; }
.quota-value { font-size: 1.15rem; font-weight: 660; margin-top: 6px; }
.quota.mid .meter-fill { fill: var(--c3); }
.quota.high .meter-fill { fill: var(--c5); }
.meter-fill { fill: var(--c1); }
svg.meter { display: block; width: 100%; height: 10px; border-radius: 5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: .82rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.insight { border-left: 3px solid var(--c3); }
.insight p { font-size: .88rem; margin-top: 4px; }
.insight .label { color: var(--muted); font-weight: 600; }
.table-block > * + * { margin-top: 6px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
table.data { border-collapse: collapse; width: 100%; font-size: .84rem; }
table.data caption { text-align: left; font-weight: 620; font-size: .85rem; padding: 10px 12px 6px; color: var(--text); }
table.data th, table.data td { padding: 7px 12px; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
table.data thead th { background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: .78rem; white-space: nowrap; }
table.data tbody th { font-weight: 560; overflow-wrap: anywhere; max-width: 22rem; }
table.data .num { text-align: right; white-space: nowrap; }
.method { margin: 0; padding-left: 1.1rem; font-size: .88rem; }
.method li + li { margin-top: 4px; }
.source-list { margin: 6px 0 0; padding-left: 1.1rem; font-size: .85rem; overflow-wrap: anywhere; }
footer { color: var(--faint); font-size: .8rem; padding: 0 20px 32px; text-align: center; }
@media (max-width: 640px) {
  #summary .cards { grid-template-columns: minmax(0, 1fr); }
  .wrap { padding: 0 12px; }
  .section { padding: 16px 14px; }
  .filters { position: static; }
  h1 { font-size: 1.35rem; }
  .barlist li { grid-template-columns: 1fr auto; }
  .barlist li svg.bar-svg { grid-column: 1 / -1; grid-row: 2; }
  .bl-note { grid-column: 1 / -1; grid-row: 3; margin-top: 0; }
  .field select, .field input { min-width: 0; width: 100%; }
  .filter-row .field { flex: 1 1 140px; }
}
@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f1f3f5; --border: #cfd5dc; --text: #111111; --muted: #444c58; --faint: #6b7380;
    --accent: #0f766e; --c1: #0f766e; --c2: #5fb3a9; --c3: #6d4fc2; --c4: #a993e0; --c5: #d4604b; --c6: #eea493; --c7: #7c8796; --c8: #b9dcd6;
    --track: #e6eaef; --free: #d7e9e6; --hatch: #8b94a3; --info-bg: #f3f8f7; --info-border: #b8dbd6; --warn-bg: #fdf1ec; --warn-border: #efb9aa; --warn-text: #8c3420;
    --shadow: none; color-scheme: light;
  }
  body { background: #fff; font-size: 12px; }
  .no-print { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .section { border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 14px 0; margin: 0; }
  .card, .chart-wrap, .gauge, .notice, table.data tr, .insight { break-inside: avoid; }
  h2 { break-after: avoid; }
  .chart-wrap, .table-wrap { overflow: visible; }
  svg.chart { min-width: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to report</a>
<header class="masthead">
  <div class="wrap masthead-inner">
    <div>
      <p class="eyebrow" id="report-kind">Agent usage analytics</p>
      <h1 id="report-title">Agent usage report</h1>
      <p class="scope" id="scope-line"></p>
      <div class="badges" id="badges"></div>
    </div>
    <div class="actions no-print">
      <button type="button" class="btn" id="theme-toggle">Switch theme</button>
      <button type="button" class="btn" id="print-button">Print</button>
    </div>
  </div>
  <nav class="wrap toc no-print" id="toc" aria-label="Report sections"></nav>
</header>
<main id="main" class="wrap" tabindex="-1">
  <noscript><div class="notice warn"><strong>JavaScript is off.</strong> This dashboard renders its embedded data with local JavaScript. The Markdown and JSON reports contain the same figures.</div></noscript>
</main>
<footer>Generated locally from the embedded report data. This file loads no external resources.</footer>
<script type="application/json" id="report-data">__REPORT_JSON__</script>

      (hasTask ? ', tasks' : '') + ' are recomputed; tools and skills follow the agent filter only. Context, quotas, coverage and insights are unfiltered.';
    if (state.from || state.to) {
      var undated = requests.filter(function (x) { return x.day === null; }).length;
      if (undated) s += ' ' + fmtInt(undated) + ' rows without a timestamp are excluded by the date filter.';
    }
    return s;
  }

  // ------------------------------------------------------------------- main
  function setupTheme() {
    var button = document.getElementById('theme-toggle');
    var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function current() { return root.getAttribute('data-theme') || (media && media.matches ? 'dark' : 'light'); }
    function sync() { button.textContent = current() === 'dark' ? 'Light theme' : 'Dark theme'; }
    button.addEventListener('click', function () { root.setAttribute('data-theme', current() === 'dark' ? 'light' : 'dark'); sync(); });
    if (media && media.addEventListener) media.addEventListener('change', sync);
    sync();
    document.getElementById('print-button').addEventListener('click', function () { window.print(); });
  }

  function run() {
    setupTheme();
    renderHeader();
    var secs = {
      context: section('context', isSession ? 'Current context' : 'Latest context by session', LEADS.context),
      summary: section('summary', isSession ? 'Lifetime usage of this session' : 'Summary', isSession ? LEADS.sessionSummary : LEADS.summary),
      insights: section('insights', 'Insights'),
      trend: section('trend', 'Usage over time', LEADS.trend),
      models: section('models', 'Models'),
      sessions: section('sessions', 'Sessions'),
      tasks: section('tasks', 'Task categories'),
      contributors: section('contributors', 'Tools and skills', LEADS.contributors),
      quotas: section('quotas', 'Quotas', LEADS.quotas),
      coverage: section('coverage', 'Coverage and warnings'),
      method: section('method', 'Methodology and pricing')
    };
    var toggles = ['daily', 'monthly'].map(function (mode) {
      return el('button', { type: 'button', 'data-mode': mode, 'aria-pressed': String(mode === trendMode), text: mode === 'daily' ? 'Daily' : 'Monthly' });
    });
    secs.trend.head.insertBefore(el('div', { class: 'segmented no-print', role: 'group', 'aria-label': 'Trend period' }, toggles), secs.trend.head.children[1] || null);

    var filters = buildFilters(update);
    var order = isSession
      ? ['context', 'filters', 'summary', 'insights', 'trend', 'contributors', 'models', 'sessions', 'tasks', 'quotas', 'coverage', 'method']
      : ['filters', 'summary', 'insights', 'trend', 'models', 'sessions', 'tasks', 'context', 'contributors', 'quotas', 'coverage', 'method'];
    var toc = document.getElementById('toc');
    order.forEach(function (key) {
      if (key === 'filters') { mainEl.appendChild(filters.node); return; }
      mainEl.appendChild(secs[key].node);
      toc.appendChild(el('a', { href: '#' + secs[key].id, text: secs[key].title }));
    });

    renderContext(secs.context);
    renderInsights(secs.insights);
    renderQuotas(secs.quotas);
    renderCoverage(secs.coverage);
    renderMethod(secs.method);

    var current = null;
    function update() {
      current = computeView();
      renderSummary(secs.summary, current);
      renderTrend(secs.trend, current, toggles);
      renderModels(secs.models, current);
      renderSessions(secs.sessions, current);
      renderTasks(secs.tasks, current);
      renderContributors(secs.contributors, current);
      if (filters.status) filters.status.textContent = statusText(current);
    }
    toggles.forEach(function (b) {
      b.addEventListener('click', function () { trendMode = b.getAttribute('data-mode'); renderTrend(secs.trend, current, toggles); });
    });
    update();
  }

  run();
})();
</script>
</body>
</html>
