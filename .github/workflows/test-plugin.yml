name: Test plugin package

on:
  pull_request:
    paths: &paths
      - 'skills/**'
      - '.claude-plugin/**'
      - 'plugin.json'
      - 'scripts/build-claude-plugin.ps1'
      - 'LICENSE'
      - '.github/workflows/test-plugin.yml'
      - '.gitattributes'
      - '.gitignore'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and verify Claude plugin ZIP
        shell: pwsh
        run: ./scripts/build-claude-plugin.ps1 -OutputDirectory $env:RUNNER_TEMP -SkipClaudeValidation
