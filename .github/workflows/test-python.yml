name: Test legacy Python

on:
  pull_request:
    paths: &paths
      - 'skills/legacy-codebase-workflows/**'
      - '!skills/legacy-codebase-workflows/SKILL.md'
      - '!skills/legacy-codebase-workflows/README.md'
      - '!skills/legacy-codebase-workflows/references/**'
      - '!skills/legacy-codebase-workflows/templates/**'
      - 'scripts/build-legacy-tools.py'
      - 'scripts/create-legacy-release-manifest.py'
      - 'tests/test_legacy_*.py'
      - '.github/workflows/test-python.yml'
      - '.gitattributes'
      - '.gitignore'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install local map dependencies
        run: python -m pip install -r skills/legacy-codebase-workflows/requirements-map.txt
      - name: Install optional vector adapter on each platform
        if: matrix.python == '3.12'
        run: python -m pip install -r skills/legacy-codebase-workflows/scripts/requirements-retrieval.txt
      - name: Test local mapping and retrieval
        env:
          LEGACY_NATIVE_BUILD: '0'
          LEGACY_REQUIRE_SQLITE_VEC: ${{ matrix.python == '3.12' && runner.os != 'macOS' && '1' || '0' }}
        run: python -m unittest discover -s tests -p "test_legacy_*.py" -v
      - name: Require native vector adapter with compatible macOS SQLite
        if: runner.os == 'macOS' && matrix.python == '3.12'
        shell: bash
        env:
          LEGACY_REQUIRE_SQLITE_VEC: '1'
        run: |
          brew install python@3.12
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$RUNNER_TEMP/legacy-vector-venv"
          "$RUNNER_TEMP/legacy-vector-venv/bin/python" -m pip install -r skills/legacy-codebase-workflows/requirements-map.txt -r skills/legacy-codebase-workflows/scripts/requirements-retrieval.txt
          "$RUNNER_TEMP/legacy-vector-venv/bin/python" -m unittest discover -s tests -p test_legacy_retrieval.py -v
