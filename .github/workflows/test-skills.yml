name: Test skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm test
      - name: Install local map dependencies
        run: python -m pip install -r skills/legacy-codebase-workflows/requirements-map.txt
      - name: Install optional vector adapter on each platform
        if: matrix.python == '3.12'
        run: python -m pip install -r skills/legacy-codebase-workflows/scripts/requirements-retrieval.txt
      - name: Test local mapping and retrieval
        env:
          LEGACY_NATIVE_BUILD: '0'
        run: python -m unittest discover -s tests -p "test_legacy_*.py" -v
      - name: Build and verify Claude plugin ZIP
        if: runner.os == 'Linux' && matrix.python == '3.12'
        shell: pwsh
        run: ./scripts/build-claude-plugin.ps1 -OutputDirectory $env:RUNNER_TEMP -SkipClaudeValidation

  semantic-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6
        with:
          version: '12.4.1'
      - name: Prepare optional inference runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/legacy-inference"
          cp skills/legacy-codebase-workflows/scripts/retrieval/package.json skills/legacy-codebase-workflows/scripts/retrieval/pnpm-lock.yaml skills/legacy-codebase-workflows/scripts/retrieval/pnpm-workspace.yaml "$RUNNER_TEMP/legacy-inference/"
          pnpm install --dir "$RUNNER_TEMP/legacy-inference" --frozen-lockfile
      - name: Install optional vector adapter and pinned Context7 client
        shell: bash
        run: |
          python -m pip install -r skills/legacy-codebase-workflows/scripts/requirements-retrieval.txt
          mkdir -p "$RUNNER_TEMP/ctx7-cli"
          printf '{"private":true,"dependencies":{"ctx7":"0.5.13"}}\n' > "$RUNNER_TEMP/ctx7-cli/package.json"
          pnpm install --dir "$RUNNER_TEMP/ctx7-cli" --ignore-scripts
      - name: Test actual local embeddings and hybrid retrieval
        env:
          LEGACY_RETRIEVAL_TEST_RUNTIME: ${{ runner.temp }}/legacy-inference
          LEGACY_RETRIEVAL_TEST_CACHE: ${{ runner.temp }}/legacy-model-cache
          LEGACY_CTX7_CLI: ${{ runner.temp }}/ctx7-cli/node_modules/ctx7/dist/index.js
        run: python -m unittest discover -s tests -p test_legacy_retrieval.py -v

  native-artifacts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/legacy-cargo-target
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native repository mapper
        run: cargo test --locked --manifest-path src/legacy-repo-map/Cargo.toml
      - name: Build standalone tools with licenses and smoke checks
        run: python scripts/build-legacy-tools.py --output-dir "${{ runner.temp }}/legacy-artifacts" --deps-dir "${{ runner.temp }}/legacy-map-deps" --tools-dir "${{ runner.temp }}/legacy-build-deps" --install --require-parity
      - name: Locate host-specific binaries
        shell: python
        run: |
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "legacy-artifacts"
          manifest = json.loads((root / "build-manifest.json").read_text())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for artifact in manifest["artifacts"]:
                  key = "LEGACY_TOOLS_BIN" if artifact["artifact"].startswith("legacy-tools-") else "LEGACY_REPO_MAP_BIN"
                  output.write(f"{key}={root / artifact['artifact'] / artifact['program']}\n")
      - name: Test actual binaries against the Python source
        env:
          LEGACY_MAP_DEPS: ${{ runner.temp }}/legacy-map-deps
        run: python -m unittest discover -s tests -p test_legacy_native.py -v
      - name: Retain reviewable native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: legacy-tools-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/legacy-artifacts/*.tar.gz
            ${{ runner.temp }}/legacy-artifacts/*.zip
            ${{ runner.temp }}/legacy-artifacts/SHA256SUMS
            ${{ runner.temp }}/legacy-artifacts/build-manifest.json
          if-no-files-found: error
          retention-days: 14
