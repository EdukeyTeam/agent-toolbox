name: Test skills

on:
  pull_request:
    paths: &paths
      - 'skills/**'
      - '!skills/*/references/**'
      - '!skills/legacy-codebase-workflows/**'
      - 'skills/legacy-codebase-workflows/SKILL.md'
      - 'tests/**/*.test.cjs'
      - 'tests/**/*.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'plugin.json'
      - '.claude-plugin/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
